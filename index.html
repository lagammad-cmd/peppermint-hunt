<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peppermint’s Christmas Scavenger Hunt</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Layout: night-pine page with falling snow. Lights over the header, puzzle in a candy-cane frame.
     Teachers (editors of this page) also get a "Your days" panel under the puzzle. */
  :root {
    --pine: #0E3A2A;
    --pine-deep: #082519;
    --snow: #F6FAF7;
    --ink: #1B2B23;
    --red: #CC2F40;
    --red-deep: #8E1F2C;
    --gold: #F4C54F;
    --mist: #BBD3C4;
    --green: #1F7A4C;
    --font-display: "Mountains of Christmas", "Trebuchet MS", "Comic Sans MS", cursive, sans-serif;
    --font-body: "Nunito", "Trebuchet MS", Arial, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #17553C 0%, var(--pine) 45%, var(--pine-deep) 100%) fixed, var(--pine);
    color: var(--snow);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
    padding-block: 10px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  [hidden] { display: none !important; }

  /* string of lights */
  .lights { position: relative; height: 40px; display: flex; justify-content: space-between; padding: 0 6px; margin: 0 -6px; }
  .lights::before {
    content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 14px;
    border-top: 2px solid #04130d; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .bulb {
    --c: var(--red);
    position: relative; width: 14px; height: 20px; margin-top: 10px;
    background: var(--c); border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
    box-shadow: 0 0 14px 3px var(--c); animation: twinkle 1.8s ease-in-out infinite alternate;
  }
  .bulb::before { content: ""; position: absolute; left: 3px; top: -5px; width: 8px; height: 6px; background: #1d2a23; border-radius: 2px 2px 0 0; }
  .bulb:nth-child(4n+1) { --c: #E2384B; }
  .bulb:nth-child(4n+2) { --c: var(--gold); animation-delay: -0.6s; }
  .bulb:nth-child(4n+3) { --c: #3FBF7F; animation-delay: -1.1s; }
  .bulb:nth-child(4n+4) { --c: #4DA3FF; animation-delay: -0.3s; }
  .bulb:nth-child(2n) { margin-top: 14px; }
  @keyframes twinkle { from { opacity: 0.45; } to { opacity: 1; } }

  header { display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);
  }
  .eyebrow svg { width: 16px; height: 16px; fill: var(--gold); flex: none; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.6vw, 48px); line-height: 1.04; text-wrap: balance;
    color: #fff; text-shadow: 0 3px 0 var(--red-deep), 0 6px 14px rgba(0,0,0,0.35);
  }
  .lede { margin: 0; color: var(--mist); max-width: 40ch; }

  /* candy-cane frame around the puzzle */
  .frame {
    padding: 11px; border-radius: 20px;
    background: repeating-linear-gradient(135deg, var(--red) 0 13px, var(--snow) 13px 26px);
    box-shadow: 0 8px 0 var(--red-deep), 0 14px 30px rgba(0,0,0,0.45);
  }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 4px; padding: 4px; background: var(--pine-deep); border-radius: 11px; width: 100%;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .board.solved { gap: 0; padding: 0; overflow: hidden; }
  .tile {
    appearance: none; border: 0; padding: 0; margin: 0; cursor: pointer; min-width: 0; min-height: 0;
    background-repeat: no-repeat; background-color: var(--pine-deep); border-radius: 7px;
    position: relative; transition: transform 0.12s ease;
  }
  .board.solved .tile { border-radius: 0; cursor: default; }
  .tile:hover { transform: scale(0.98); }
  .tile.sel {
    transform: scale(0.94) rotate(-2deg); z-index: 1;
    box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px rgba(244,197,79,0.35), 0 8px 18px rgba(0,0,0,0.5);
  }
  .tile.pop { animation: pop 0.32s ease-out; }
  @keyframes pop { 0% { transform: scale(1.1) rotate(3deg); } 60% { transform: scale(0.97) rotate(-1deg); } 100% { transform: scale(1); } }
  .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; z-index: 2; }
  .board.solved .tile:hover { transform: none; }
  .plain { display: block; width: 100%; height: auto; border-radius: 11px; }

  .msg {
    background: var(--snow); color: var(--ink); border-radius: 16px; padding: 14px 16px;
    border-top: 6px solid var(--gold); box-shadow: 0 8px 0 rgba(0,0,0,0.25); text-align: center;
  }
  .msg h2 { margin: 0 0 2px; font-family: var(--font-display); font-size: 34px; line-height: 1.05; color: var(--red); }
  .msg p { margin: 0; font-weight: 600; }
  .hint { margin: 0; padding: 10px 14px; border: 2px dashed var(--gold); border-radius: 14px; color: var(--snow); background: rgba(0,0,0,0.18); }
  .hint b { color: var(--gold); text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  button.btn {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; letter-spacing: 0.02em;
    padding: 12px 24px; border-radius: 999px; border: 2px solid var(--snow);
    background: transparent; color: var(--snow); transition: transform 0.1s ease;
  }
  button.btn:hover { background: var(--snow); color: var(--pine); }
  button.btn.primary { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-deep); }
  button.btn.primary:hover { background: #E03A4D; border-color: #E03A4D; color: #fff; }
  button.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-deep); }
  button.btn:focus-visible, .panel button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty { padding: 28px 18px; text-align: center; background: var(--snow); color: var(--ink); border-radius: 18px; box-shadow: 0 8px 0 rgba(0,0,0,0.25); }
  .empty h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 36px; color: var(--red); line-height: 1.05; }
  .empty p { margin: 0; }

  .pv {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border-radius: 12px; background: rgba(244,197,79,0.16); border: 1px solid var(--gold);
    font-weight: 800; font-size: 14px; color: var(--gold);
  }
  .pv button { appearance: none; font: inherit; font-weight: 800; font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
  .pv button:hover { background: var(--gold); color: var(--pine-deep); }

  /* teacher panel */
  .panel { background: var(--snow); color: var(--ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 0 rgba(0,0,0,0.25); }
  .panel h2 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--red); }
  .panel .muted { margin: 0; color: #4b5f55; font-size: 14px; }
  .day { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding-top: 12px; border-top: 1px solid #d3e1d8; }
  .day img { width: 76px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: #dbe7df; }
  .day .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .day .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .day .date { font-weight: 800; }
  .pill { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
  .pill.open { background: #D6F0E1; color: #145C37; }
  .pill.closed { background: #E7ECE9; color: #3B4D43; }
  .pill.locked { background: #FBEBC0; color: #6B4B00; }
  .pill.ended { background: #E7ECE9; color: #56665D; }
  .day .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 800; color: #3E5248; min-width: 0; }
  .panel input[type="text"], .panel input[type="date"], .panel select {
    font: inherit; font-weight: 400; color: var(--ink); background: #fff; border: 1px solid #b4c6bb; border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%;
  }
  .panel input[type="file"] { font: inherit; font-weight: 400; max-width: 100%; }
  .day .row label { flex: 1 1 130px; }
  .panel .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel button.sm {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 14px;
    padding: 8px 16px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .panel button.sm:hover:not(:disabled) { background: var(--ink); color: var(--snow); }
  .panel button.sm.go { background: var(--green); border-color: var(--green); color: #fff; }
  .panel button.sm.go:hover:not(:disabled) { background: #176339; border-color: #176339; }
  .panel button.sm.stop { border-color: var(--red); color: var(--red); }
  .panel button.sm.stop:hover:not(:disabled) { background: var(--red); color: #fff; }
  .panel button.sm:disabled { opacity: 0.45; cursor: not-allowed; }
  .addform { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid #d3e1d8; }
  .note { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 700; color: #145C37; }
  .note.err { color: var(--red); }
  .foot { margin: 0; text-align: center; font-size: 13px; color: var(--mist); }

  /* extra puzzle styles */
  .tile.empty { background-image: none !important; background-color: rgba(8,37,25,0.9); cursor: default; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12); transform: none; }
  .tile:disabled:not(.empty) { cursor: default; }

  .jig { position: relative; width: 100%; background: var(--pine-deep); border-radius: 11px; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .jig .ghost { position: absolute; opacity: 0.24; background-size: 100% 100%; border-radius: 4px; outline: 2px dashed rgba(244,197,79,0.6); outline-offset: -2px; pointer-events: none; }
  .jp { position: absolute; touch-action: none; cursor: grab; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.55)); }
  .jp.lift { cursor: grabbing; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6)); }
  .jp.locked { pointer-events: none; filter: none; }

  .reveal { position: relative; border-radius: 11px; overflow: hidden; background: var(--pine-deep); }
  .reveal img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .reveal canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: opacity 0.9s ease; }
  .reveal canvas.melt { opacity: 0; pointer-events: none; }
  .reveal .lbl {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
    padding: 10px 18px; border-radius: 999px; background: rgba(14,58,42,0.85); color: #fff; font-weight: 800;
  }

  .pat { background: var(--pine-deep); border-radius: 11px; padding: 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--snow); }
  .pat .gift { width: 54px; }
  .pat h2 { margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 1; text-align: center; color: var(--gold); }
  .pat .patsub { margin: 0; text-align: center; color: var(--mist); font-weight: 600; max-width: 32ch; }
  .pgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .pcell {
    appearance: none; min-width: 0; aspect-ratio: 1; padding: 6px; display: grid; place-items: center;
    border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.07); border-radius: 12px;
    color: var(--gold); font: 800 26px var(--font-body); cursor: default;
  }
  .pcell svg { width: 100%; height: 100%; display: block; }
  .pcell.blank { border-style: dashed; border-color: var(--gold); background: rgba(244,197,79,0.1); cursor: pointer; }
  .pcell.blank.cur { box-shadow: 0 0 0 3px var(--gold), 0 0 14px rgba(244,197,79,0.5); }
  .pcell:disabled { opacity: 1; }
  .pcell.shake { animation: shake 0.45s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .ptray { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .ptray button {
    appearance: none; width: 64px; height: 64px; padding: 8px; cursor: pointer;
    border: 2px solid var(--snow); background: rgba(255,255,255,0.1); border-radius: 14px;
  }
  .ptray button:hover { background: rgba(255,255,255,0.22); }
  .ptray button svg { width: 100%; height: 100%; display: block; }
  .pcell:focus-visible, .ptray button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .patmsg { margin: 0; min-height: 1.4em; font-weight: 800; color: var(--gold); text-align: center; }
  .unwrap { animation: unwrap 0.7s ease-out; }
  @keyframes unwrap { from { opacity: 0; transform: scale(0.92) rotate(-1deg); } to { opacity: 1; transform: none; } }

  /* riddle style */
  .riddle-card {
    width: 100%; padding: 14px 16px 18px; text-align: center; border-radius: 16px;
    background: var(--snow); color: var(--ink); border: 3px solid var(--gold); box-shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  .riddle-card .kicker { display: block; margin-bottom: 6px; font-weight: 800; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); }
  .riddle-text { margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.15; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: balance; }
  .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; width: 100%; }
  .word { display: flex; flex-wrap: nowrap; justify-content: center; gap: 5px; max-width: 100%; }
  .slot {
    appearance: none; width: 36px; flex: 0 1 36px; min-width: 22px; height: 46px; padding: 0; cursor: pointer; border-radius: 10px;
    border: 2px dashed var(--gold); background: rgba(244,197,79,0.1); color: #fff; font: 800 24px var(--font-body);
  }
  .slot.filled { border-style: solid; background: rgba(255,255,255,0.16); }
  .slot:disabled { cursor: default; opacity: 1; }
  .slot.shake { animation: shake 0.45s; }
  .lets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .let {
    appearance: none; width: 46px; height: 50px; padding: 0; cursor: pointer; border-radius: 12px;
    border: 2px solid var(--snow); background: var(--red); color: #fff; font: 800 24px var(--font-body); box-shadow: 0 4px 0 var(--red-deep);
  }
  .let:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-deep); }
  .let:disabled { opacity: 0.25; cursor: default; box-shadow: none; transform: translateY(3px); }
  .slot:focus-visible, .let:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .panel textarea { font: inherit; font-weight: 400; color: var(--ink); background: #fff; border: 1px solid #b4c6bb; border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%; width: 100%; resize: vertical; }
  .day .row label.wide { flex-basis: 100%; }
  @media (prefers-reduced-motion: reduce) { .slot.shake { animation: none; } }

  /* stats ornaments */
  .status { display: flex; justify-content: center; gap: 14px; padding-top: 6px; }
  .orn {
    position: relative; width: 92px; aspect-ratio: 1; border-radius: 50%; margin-top: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset -8px -10px 16px rgba(0,0,0,0.28), inset 6px 6px 12px rgba(255,255,255,0.25), 0 6px 14px rgba(0,0,0,0.35);
  }
  .orn::before { content: ""; position: absolute; top: -10px; left: 50%; width: 22px; height: 12px; margin-left: -11px; background: var(--gold); border-radius: 4px 4px 2px 2px; }
  .orn::after { content: ""; position: absolute; top: -17px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border: 2px solid var(--gold); border-bottom: 0; border-radius: 10px 10px 0 0; }
  .orn:nth-child(1) { background: radial-gradient(circle at 32% 28%, #F0586A, var(--red) 55%, var(--red-deep)); }
  .orn:nth-child(2) { background: radial-gradient(circle at 32% 28%, #3FA56F, #1F7A4C 55%, #0F4B2E); }
  .orn:nth-child(3) { background: radial-gradient(circle at 32% 28%, #5BAEFF, #2A78D6 55%, #174A8F); }
  .orn span { font-weight: 800; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.92); }
  .orn strong { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  @media (max-width: 380px) { .orn { width: 82px; } .orn strong { font-size: 26px; } .status { gap: 10px; } }
  .msg .winline { margin-top: 6px; font-weight: 600; font-size: 14px; color: #3E5248; }

  /* leaderboard */
  .tabs { display: flex; gap: 8px; }
  .tabs button {
    appearance: none; cursor: pointer; font: inherit; font-weight: 800; font-size: 14px; padding: 7px 16px; border-radius: 999px;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--snow); }
  .tabs button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .rows.scroll { max-height: 380px; overflow-y: auto; }
  .lb-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #EAF2EC; }
  .lb-row.me { background: #FBEBC0; box-shadow: inset 0 0 0 2px var(--gold); }
  .rk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: #fff; border: 2px solid #b4c6bb; color: var(--ink); }
  .rk.r1 { background: var(--gold); border-color: #C79A22; }
  .rk.r2 { background: #D3DCE0; border-color: #9AA9B0; }
  .rk.r3 { background: #E3AF80; border-color: #B87A48; }
  .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; color: #3E5248; font-size: 14px; text-align: right; }
  .sep { text-align: center; color: #6b7d73; font-weight: 800; }
  .tctl { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-top: 12px; border-top: 1px solid #d3e1d8; }
  .panel label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }

  /* nicer ornaments: gold banding on the lower half, colored glow, gentle swing */
  .orn { padding-bottom: 16px; transform-origin: 50% -16px; animation: sway 5s ease-in-out infinite alternate; }
  .orn:nth-child(1) { --glow: rgba(226,56,75,0.6); }
  .orn:nth-child(2) { --glow: rgba(63,191,127,0.5); animation-delay: -1.7s; }
  .orn:nth-child(3) { --glow: rgba(77,163,255,0.55); animation-delay: -3.3s; }
  .orn {
    box-shadow: inset -8px -10px 16px rgba(0,0,0,0.28), inset 6px 6px 12px rgba(255,255,255,0.25), 0 6px 14px rgba(0,0,0,0.35), 0 16px 22px -8px var(--glow);
  }
  .orn .bd, .orn .bd2 { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
  .orn .bd { background: linear-gradient(to bottom, transparent 0 74%, #F4C54F 74% 76.5%, transparent 76.5% 79%, rgba(244,197,79,0.9) 79% 80.5%, transparent 80.5%); }
  .orn .bd2 { background: radial-gradient(circle at 50% 87%, #FFE9A8 0 1.6px, transparent 2.3px) 0 0 / 9px 100%; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { .orn { animation: none; } }

  /* easter eggs */
  .eyebrow svg { width: 16px; height: 16px; padding: 6px; margin: -6px; box-sizing: content-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .bulb { cursor: pointer; }
  .bulb.flash { animation: flash 0.55s ease-out; }

  #peek .d-unwrap .ribbon { position: absolute; left: 0; right: 0; top: 42%; height: 16%; background: #F4C54F; animation: pktear 3s ease-in-out infinite; clip-path: none; opacity: 1; }
  #peek .d-pattern { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 18px; background: #14533a; }
  #peek .d-pattern .sh { width: 40px; height: 40px; display: grid; place-items: center; font: 900 24px Nunito, sans-serif; }
  #peek .d-pattern .ball { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a98, #c92f42); } #peek .d-pattern .star { background: #F4C54F; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); } #peek .d-pattern .tree { background: #3fbf7f; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  #peek .d-pattern .q { border: 3px dashed #fff; border-radius: 10px; color: #fff; animation: pkq 1.6s ease-in-out infinite; } @keyframes pkq { 50% { background: rgba(255,255,255,0.25); } }
  #peek .d-riddle { background: #f8f1e1; padding: 18px 12px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  #peek .d-riddle .rl { width: 100%; display: flex; flex-direction: column; gap: 8px; } #peek .d-riddle em { display: block; height: 8px; border-radius: 4px; background: #c9b996; } #peek .d-riddle em.s { width: 60%; }
  #peek .d-riddle .rt { display: flex; gap: 6px; } #peek .d-riddle .rt span { width: 28px; height: 34px; border-radius: 6px; background: #fff; border: 2px solid #CC2F40; display: grid; place-items: center; font: 900 18px Nunito, sans-serif; color: #8E1F2C; animation: pkbob 1.8s ease-in-out infinite; } #peek .d-riddle .rt span:nth-child(2n) { animation-delay: 0.3s; } @keyframes pkbob { 50% { transform: translateY(-5px); } }
  #peek .d-match { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; padding: 10px; background: #14533a; }
  #peek .d-match .mc { border-radius: 10px; background: repeating-linear-gradient(45deg, #CC2F40 0 8px, #fff 8px 16px); border: 2px solid #fff; display: grid; place-items: center; overflow: hidden; }
  #peek .d-match .mc.up { background: #fff; } #peek .d-match .mc img { width: 100%; height: 100%; object-fit: contain; }
  #peek .d-match .mc.flip { animation: pkflip 2.6s ease-in-out infinite; } @keyframes pkflip { 0%, 30% { transform: rotateY(90deg); } 45%, 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #peek .pk-demo *, #peek .pk-demo { animation: none !important; } }
  /* Snowy Village (red light, green light, then long-press the logo) */
  #theatre { position: fixed; inset: 0; z-index: 9100; background: #16305a; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; }
  #theatre canvas { display: block; touch-action: none; cursor: crosshair; }
  #theatre .vl-top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  #theatre .vl-title { font-family: 'Mountains of Christmas', cursive; font-size: 30px; color: #fff; text-shadow: 0 2px 6px rgba(0, 20, 50, 0.7); }
  #theatre .vl-x { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #F4C54F; background: rgba(8, 28, 70, 0.7); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }
  #theatre .vl-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(96vw, 560px); background: rgba(8, 28, 70, 0.78); border: 2px solid rgba(143, 208, 255, 0.6); border-radius: 18px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(4px); }
  #theatre .vl-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #theatre .vl-b { appearance: none; border: 2px solid transparent; border-radius: 999px; padding: 8px 14px; font: 800 14px 'Nunito', system-ui, sans-serif; background: #e9f1fb; color: #0b2a5c; cursor: pointer; }
  #theatre .vl-b.on { background: #F4C54F; border-color: #fff; }
  #theatre .vl-c { appearance: none; width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.55); cursor: pointer; padding: 0; }
  #theatre .vl-c.on { border-color: #fff; box-shadow: 0 0 0 3px #F4C54F; }
  #theatre .vl-title { font-size: clamp(20px, 5.4vw, 30px); line-height: 1.05; max-width: calc(100% - 64px); }
  #village .vl-flash { position: absolute; inset: 0; background: #fff; pointer-events: none; animation: vlflash 0.9s ease-out forwards; z-index: 5; }
  @keyframes vlflash { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }
</style>

<script>
/* Data lives in the page's database:
   hunts/<YYYY-MM-DD>  full record (photo, style, hint). Readable only by editors of this page.
   open/<YYYY-MM-DD>   copy of the record, present only while a day is open. Readable by students.
   Students only ever read open/<today>, so a closed or future photo never reaches their browser. */

const N = 3;
const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
/* The school day runs on New York time. The clock is synced to the server's, so a wrong device clock changes nothing. */
let clockSkew = 0, OPEN_HOUR = 8;
const nowMs = () => Date.now() + clockSkew;
function syncClock(serverNow) { if (Number.isFinite(serverNow)) clockSkew = serverNow - Date.now(); }
const NY_DAY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" });
const todayKey = () => NY_DAY.format(new Date(nowMs()));
/* talking to the Apps Script backend (this page lives on GitHub; Apps Script is the API) */
/* ===== FILL THESE IN (see SETUP-GITHUB.md) ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwy9YtiLP44h5VwRbrMHDqCtv9h5pI5ul1RzE5Hq9XJqTSkh795BTLNNFpTza4haRV9/exec";      // ends in /exec
const CLIENT_ID = "744678420851-ghs02n4emj9n3t41fijcsvkiceq3rcru.apps.googleusercontent.com";            // ends in .apps.googleusercontent.com
const SCHOOL_DOMAIN = "fordhamprep.org";
/* ================================================ */
let idToken = "", signInP = null;
const TOKEN_KEY = "hunt-id-token";
function jwtClaims(t) { try { const b = String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(b)))); } catch (e) { return null; } }
function tokenOk(t) { const c = jwtClaims(t); return !!(c && c.exp * 1000 > Date.now() + 60000 && String(c.email || "").toLowerCase().endsWith("@" + SCHOOL_DOMAIN)); }
function forgetToken() { idToken = ""; try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* fine */ } }
function gisReady() {
  return new Promise((res, rej) => {
    const ok = () => window.google && google.accounts && google.accounts.id;
    if (ok()) { res(); return; }
    let n = 0; const iv = setInterval(() => { if (ok()) { clearInterval(iv); res(); } else if (++n > 120) { clearInterval(iv); rej(new Error("Couldn’t load Google sign-in. Check your internet connection and reload the page.")); } }, 100);
  });
}
/* shows the “Sign in with Google” card (an account chooser) and resolves once a school account has signed in */
function signIn() {
  if (signInP) return signInP;
  signInP = (async () => {
    try { const s = localStorage.getItem(TOKEN_KEY); if (s && tokenOk(s)) { idToken = s; return; } } catch (e) { /* fine */ }
    await gisReady();
    await new Promise((resolve) => {

    lede: "Today’s photo is wrapped up. Flip two cards at a time to find the matching pals. Match all three pairs to unwrap it, then go find the spot in the school."
  },
  image: {
    label: "Plain photo", plain: true, build: buildPlain,
    lede: "Somewhere in the school, this exact spot is waiting. Find it."
  }
};
const modeOf = (h) => (MODES[h.mode] ? h.mode : "scrambled");
const rand = (n) => Math.floor(Math.random() * n);

let game = null;     // { hunt, preview, token, stats }
let activeTimer = null;
const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const setText = (id, v) => { const e = $(id); if (e) e.textContent = v; };
const stopTimer = () => { if (activeTimer) { clearInterval(activeTimer); activeTimer = null; } };

function startGame(hunt, preview, note) {
  game = { hunt, preview: !!preview, note: note || "" };
  renderGame();
}

function showMessage(title, text) {
  stopTimer();
  game = null;
  const play = $("play"); play.textContent = "";
  play.appendChild(el("div", { class: "empty" }, el("h2", { text: title }), el("p", { text })));
  $("lede").textContent = "";
}

function orn(label, id, value) {
  return el("div", { class: "orn" },
    el("i", { class: "bd", "aria-hidden": "true" }), el("i", { class: "bd2", "aria-hidden": "true" }),
    el("span", { text: label }), el("strong", { id, text: value }));
}

function renderGame() {
  stopTimer();
  const play = $("play");
  play.textContent = "";
  if (!game) return;
  const hunt = game.hunt, mode = modeOf(hunt), M = MODES[mode];
  $("dateLabel").textContent = "· " + prettyDate(hunt.date);
  $("lede").textContent = M.lede;

  if (game.preview) {
    play.appendChild(el("div", { class: "pv" }, el("span", { text: game.note || "Previewing the student view. Results aren\u2019t saved." }),
      el("button", { type: "button", text: "Back to teacher view", onclick: () => setView("teacher") })));
  }
  if (hunt.hint) play.appendChild(el("p", { class: "hint" }, el("b", { text: "Hint " }), hunt.hint));

  const token = game.token = {};
  const st = game.stats = { moves: 0, startedAt: null, seconds: 0 };
  const img = new Image();
  img.onload = () => {
    if (!game || game.token !== token) return;
    const frameEl = el("div", { class: "frame" });
    const below = el("div", { class: "stack" });
    play.appendChild(frameEl);
    if (!M.plain) play.appendChild(el("div", { class: "status" }, orn("Moves", "st-moves", "0"), orn("Time", "st-time", "0:00"), orn("Rank", "st-rank", "—")));
    play.appendChild(below);
    let won = false;

    const start = () => {
      if (st.startedAt || won) return;
      st.startedAt = Date.now();
      activeTimer = setInterval(() => { st.seconds = Math.floor((Date.now() - st.startedAt) / 1000); setText("st-time", fmt(st.seconds)); }, 500);
    };
    const move = () => { if (won) return; start(); st.moves++; setText("st-moves", st.moves); };
    const stop = () => {
      stopTimer();
      if (st.startedAt) st.seconds = Math.max(1, Math.round((Date.now() - st.startedAt) / 1000));
      setText("st-time", fmt(st.seconds));
    };

    const addActions = (done) => {
      if (done) santaTaps = 0;
      const a = el("div", { class: "actions" },
        el("button", { type: "button", class: "btn" + (done ? " primary" : ""), text: done ? "Play again" : M.again, onclick: renderGame }));
      if (done && !reduceMotion) a.appendChild(el("button", { type: "button", class: "btn", text: "Watch Santa again", onclick: () => { if (recordTap()) return; santaTaps++; celebrate(); if (santaTaps >= 3) { santaTaps = 0; showPals(); } } }));
      below.appendChild(a);
    };
    const win = () => {
      if (won) return; won = true; stop();
      below.textContent = "";
      const line = el("p", { class: "winline" });
      below.appendChild(el("div", { class: "msg", role: "status" },
        el("h2", { text: "Ho ho hooray!" }), el("p", { text: "Congratulations! Now go find peppermint!" }), line));
      addActions(true);
      celebrate();
      recordResult(hunt, st, line);
    };
    M.build({ frame: frameEl, hunt, img, win, start, move });
    if (!M.plain) addActions(false);
    refreshRankStat();
  };
  img.onerror = () => showMessage("Photo missing", "This day has no readable photo. Ask your teacher to upload it again.");
  img.src = hunt.image;
}

function showPhoto(frame, hunt, img, anim) {
  frame.textContent = "";
  frame.appendChild(el("img", { class: "plain" + (anim ? " unwrap" : ""), src: hunt.image, alt: "Photo of a place in the school", width: img.naturalWidth, height: img.naturalHeight }));
}

function buildMatch({ frame, hunt, img, win, start, move }) {
  const deck = [0, 1, 2, 0, 1, 2];
  for (let i = deck.length - 1; i > 0; i--) { const j = rand(i + 1); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  const wrap = el("div", { class: "pat" });
  const grid = el("div", { class: "mgrid" });
  const cards = [];
  let first = -1, lock = false, matched = 0;
  const label = (i) => "Card " + (i + 1) + ", " + (cards[i].classList.contains("up") ? PALS[deck[i]].name : "face down");
  const snow = '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4v40M7 14l34 20M41 14L7 34M24 4l-5 5M24 4l5 5M24 44l-5-5M24 44l5-5"/></svg>';
  deck.forEach((p, i) => {
    const back = el("span", { class: "mface mback" }); back.innerHTML = snow;
    const front = el("span", { class: "mface mfront" }, el("img", { src: PALS[p].src, alt: "", width: "254", height: "300" }));
    const b = el("button", { type: "button", class: "mcard", onclick: () => flip(i) }, el("span", { class: "in" }, back, front));
    cards.push(b); grid.appendChild(b); b.setAttribute("aria-label", "Card " + (i + 1) + ", face down");
  });
  const setUp = (i, up) => { cards[i].classList.toggle("up", up); cards[i].setAttribute("aria-label", label(i)); };
  function flip(i) {
    const c = cards[i];
    if (lock || c.classList.contains("up")) return;
    start(); setUp(i, true);
    if (first < 0) { first = i; return; }
    const a = first; first = -1; move();
    if (deck[a] === deck[i]) {
      [a, i].forEach((k) => { cards[k].classList.add("done"); cards[k].disabled = true; });
      if (++matched === 3) { lock = true; setTimeout(() => { showPhoto(frame, hunt, img, true); win(); }, 750); }
    } else {
      lock = true;
      setTimeout(() => { setUp(a, false); setUp(i, false); lock = false; }, 900);
    }
  }
  wrap.append(el("h2", { text: "Match the pals" }), el("p", { class: "patsub", text: "Flip two cards. Find all three pairs to unwrap the photo." }), grid);
  frame.appendChild(wrap);
}

/* --- plain photo --- */
function buildPlain({ frame, hunt, img }) { showPhoto(frame, hunt, img, false); }

/* --- shared 3x3 board --- */
function makeBoard(hunt, img) {
  const board = el("div", { class: "board" });
  board.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
  const tiles = [];
  for (let i = 0; i < N * N; i++) {
    const b = el("button", { type: "button", class: "tile" });
    b.style.backgroundImage = "url(" + hunt.image + ")";
    b.style.backgroundSize = (N * 100) + "% " + (N * 100) + "%";
    board.appendChild(b); tiles.push(b);
  }
  return { board, tiles };
}
function setPiece(b, p) {
  b.style.backgroundPosition = ((p % N) * 100 / (N - 1)) + "% " + (Math.floor(p / N) * 100 / (N - 1)) + "%";
}

/* --- swap tiles --- */
function buildSwap({ frame, hunt, img, win, start, move }) {
  const { board, tiles } = makeBoard(hunt, img);
  let order, sel = null, pop = [], done = false;
  do {
    order = Array.from({ length: N * N }, (_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = rand(i + 1); [order[i], order[j]] = [order[j], order[i]]; }
  } while (order.filter((v, i) => v === i).length > 2);
  const paint = () => tiles.forEach((b, i) => {
    setPiece(b, order[i]);
    b.classList.toggle("sel", sel === i);
    b.classList.toggle("pop", pop.includes(i));
    b.setAttribute("aria-pressed", sel === i ? "true" : "false");
    b.setAttribute("aria-label", "Tile " + (i + 1) + " of " + (N * N) + (sel === i ? ", selected" : ""));
  });
  tiles.forEach((b, i) => b.addEventListener("click", () => {
    if (done) return;
    if (sel === null) { start(); sel = i; paint(); return; }
    if (sel === i) { sel = null; paint(); return; }
    const a = sel;
    [order[a], order[i]] = [order[i], order[a]];
    sel = null; move();
    if (order.every((v, k) => v === k)) { done = true; board.classList.add("solved"); pop = []; paint(); win(); return; }
    pop = [a, i]; paint();
    setTimeout(() => { pop = []; tiles.forEach((t) => t.classList.remove("pop")); }, 340);
  }));
  frame.appendChild(board); paint();
}

/* --- slide puzzle (last piece is the empty space) --- */
function buildSlide({ frame, hunt, img, win, start, move }) {
  const { board, tiles } = makeBoard(hunt, img);
  const EMPTY = N * N - 1, url = "url(" + hunt.image + ")";
  const nbrs = (i) => {
    const r = Math.floor(i / N), c = i % N, o = [];
    if (r > 0) o.push(i - N); if (r < N - 1) o.push(i + N); if (c > 0) o.push(i - 1); if (c < N - 1) o.push(i + 1);
    return o;
  };
  const order = Array.from({ length: N * N }, (_, i) => i);
  let hole = EMPTY, prev = -1;
  const walk = (steps) => {
    for (let k = 0; k < steps; k++) {
      const opts = nbrs(hole).filter((n) => n !== prev);
      const n = opts[rand(opts.length)];
      order[hole] = order[n]; order[n] = EMPTY; prev = hole; hole = n;
    }
  };
  walk(160);
  while (order.every((v, i) => v === i)) walk(20);
  let done = false;
  const paint = () => tiles.forEach((b, i) => {
    const p = order[i], isHole = p === EMPTY && !done;
    b.classList.toggle("empty", isHole);
    b.style.backgroundImage = isHole ? "none" : url;
    setPiece(b, p);
    b.disabled = isHole || done;
    b.setAttribute("aria-label", isHole ? "Empty space" : "Tile " + (i + 1) + " of " + (N * N));
  });
  tiles.forEach((b, i) => b.addEventListener("click", () => {
    if (done) return;
    const h = order.indexOf(EMPTY);
    if (!nbrs(h).includes(i)) return;
    [order[h], order[i]] = [order[i], order[h]]; move();
    if (order.every((v, k) => v === k)) { done = true; board.classList.add("solved"); paint(); win(); return; }
    paint();
  }));
  frame.appendChild(board); paint();
}

/* --- jigsaw with real tabs, dragged onto the board --- */
function tabEdge(p, sx, sy, dx, dy, nx, ny, len, s) {
  const P = (u, v) => [sx + dx * u * len + nx * v * len * s, sy + dy * u * len + ny * v * len * s];
  const to = (u, v) => p.lineTo(...P(u, v));
  const bez = (a, b, c, d, e, f) => p.bezierCurveTo(...P(a, b), ...P(c, d), ...P(e, f));
  if (!s) { to(1, 0); return; }
  to(0.34, 0);
  bez(0.40, 0.00, 0.43, 0.03, 0.42, 0.07);
  bez(0.41, 0.11, 0.37, 0.13, 0.37, 0.19);
  bez(0.37, 0.26, 0.43, 0.29, 0.50, 0.29);
  bez(0.57, 0.29, 0.63, 0.26, 0.63, 0.19);
  bez(0.63, 0.13, 0.59, 0.11, 0.58, 0.07);
  bez(0.57, 0.03, 0.60, 0.00, 0.66, 0.00);
  to(1, 0);
}

function buildJigsaw({ frame, hunt, img, win, start, move }) {
  const iw = img.naturalWidth, ih = img.naturalHeight, pw = iw / N, ph = ih / N;
  const padX = Math.ceil(0.31 * ph), padY = Math.ceil(0.31 * pw);
  const cw = Math.ceil(pw + 2 * padX), ch = Math.ceil(ph + 2 * padY);
  const Wc = Math.round(iw / 0.6), bx = (Wc - iw) / 2, by = padY;
  const Hc = Math.round(by + ih + ph * 2.3);
  const sgn = () => (Math.random() < 0.5 ? 1 : -1);
  const hS = Array.from({ length: N - 1 }, () => Array.from({ length: N }, sgn));   // bottom bump of piece above
  const vS = Array.from({ length: N }, () => Array.from({ length: N - 1 }, sgn));   // right bump of piece on the left

  const area = el("div", { class: "jig" });
  area.style.aspectRatio = Wc + " / " + Hc;
  const pct = (v, total) => (v / total * 100) + "%";
  const ghost = el("div", { class: "ghost" });
  ghost.style.cssText = "left:" + pct(bx, Wc) + ";top:" + pct(by, Hc) + ";width:" + pct(iw, Wc) + ";height:" + pct(ih, Hc) + ";background-image:url(" + hunt.image + ")";
  area.appendChild(ghost);

  const pieces = [];
  const slots = Array.from({ length: N * N }, (_, i) => i).sort(() => Math.random() - 0.5);
  let z = 10, locked = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const sT = r === 0 ? 0 : -hS[r - 1][c], sB = r === N - 1 ? 0 : hS[r][c];
    const sL = c === 0 ? 0 : -vS[r][c - 1], sR = c === N - 1 ? 0 : vS[r][c];
    const path = new Path2D();
    path.moveTo(padX, padY);
    tabEdge(path, padX, padY, 1, 0, 0, -1, pw, sT);
    tabEdge(path, padX + pw, padY, 0, 1, 1, 0, ph, sR);
    tabEdge(path, padX + pw, padY + ph, -1, 0, 0, 1, pw, sB);
    tabEdge(path, padX, padY + ph, 0, -1, -1, 0, ph, sL);
    path.closePath();
    const cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch; cv.className = "jp";
    const g = cv.getContext("2d", { willReadFrequently: true });
    const sx = c * pw - padX, sy = r * ph - padY;
    const x0 = Math.max(0, sx), y0 = Math.max(0, sy), x1 = Math.min(iw, sx + cw), y1 = Math.min(ih, sy + ch);
    g.save(); g.clip(path);
    g.drawImage(img, x0, y0, x1 - x0, y1 - y0, x0 - sx, y0 - sy, x1 - x0, y1 - y0);
    g.restore();
    g.lineJoin = "round"; g.lineWidth = 2.5; g.strokeStyle = "rgba(0,0,0,0.5)"; g.stroke(path);
    g.lineWidth = 1; g.strokeStyle = "rgba(255,255,255,0.35)"; g.stroke(path);

    const p = { cv, cx: bx + c * pw - padX, cy: by + r * ph - padY, x: 0, y: 0, locked: false };
    const minY = Math.min(by + ih - padY * 0.4, Hc - ch);
    const slot = slots.pop();
    p.x = (slot + Math.random() * 0.9) / N / N * (Wc - cw) * 1;
    p.y = minY + Math.random() * Math.max(0, Hc - ch - minY);
    cv._p = p;
    cv.style.cssText = "left:" + pct(p.x, Wc) + ";top:" + pct(p.y, Hc) + ";width:" + pct(cw, Wc) + ";height:" + pct(ch, Hc) + ";z-index:" + (++z);
    pieces.push(p);
  }
  pieces.sort(() => Math.random() - 0.5).forEach((p) => { p.cv.style.zIndex = ++z; area.appendChild(p.cv); });

  let drag = null;
  const place = (p) => { p.cv.style.left = pct(p.x, Wc); p.cv.style.top = pct(p.y, Hc); };
  area.addEventListener("pointerdown", (e) => {
    if (drag || !(e.target instanceof HTMLCanvasElement)) return;

  const box = el("div", { class: "reveal" + (tear ? " tear" : "") });
  box.style.aspectRatio = iw + " / " + ih;
  const photo = el("img", { src: hunt.image, alt: "", draggable: "false" });
  const cv = el("canvas", { width: iw, height: ih, "aria-label": ariaText });
  const g = cv.getContext("2d", { willReadFrequently: true });

  const probe = document.createElement("canvas");

    pg.clearRect(0, 0, probe.width, probe.height);
    pg.drawImage(cv, 0, 0, probe.width, probe.height);

  };

    for (let i = 0; i < n; i++) {
      const th = off + i * 6.2832 / n, rr = r * (0.62 + Math.random() * 0.55);
      g[i ? "lineTo" : "moveTo"](x + Math.cos(th) * rr, y + Math.sin(th) * rr);

    const s = el("span", { class: "scrap" });
    s.style.left = (p[0] / iw * 100) + "%"; s.style.top = (p[1] / ih * 100) + "%";
    s.style.setProperty("--s", (10 + Math.random() * 16) + "px");
    s.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    s.style.setProperty("--dy", (50 + Math.random() * 90) + "px");

/* --- pattern first, then the photo is unwrapped --- */
const P_COLORS = { red: "#E2384B", gold: "#F4C54F", green: "#3FBF7F", blue: "#4DA3FF", white: "#F6FAF7" };
const P_SHAPES = ["ball", "star", "tree"];
const P_ALL = P_SHAPES.flatMap((s) => Object.keys(P_COLORS).map((c) => s + "-" + c));
function symSVG(sym) {
  const [shape, color] = sym.split("-"), f = P_COLORS[color];

  if (shape === "ball") {
    inner = '<rect x="19.5" y="3" width="9" height="8" rx="2" fill="#B58A22"/><circle cx="24" cy="28" r="16" fill="' + f + '"/><circle cx="18" cy="22" r="4.5" fill="rgba(255,255,255,0.55)"/>';
  } else if (shape === "star") {
    const pts = [];
    for (let i = 0; i < 10; i++) { const a = (-90 + i * 36) * Math.PI / 180, r = i % 2 ? 9 : 21; pts.push((24 + r * Math.cos(a)).toFixed(1) + "," + (26 + r * Math.sin(a)).toFixed(1)); }
    inner = '<polygon points="' + pts.join(" ") + '" fill="' + f + '" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linejoin="round"/>';
  } else {
    inner = '<path d="M24 3 L37 19 H30 L42 34 H6 L18 19 H11 Z" fill="' + f + '" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linejoin="round"/><rect x="21" y="34" width="6" height="9" fill="#7A4C31"/>';
  }
  return '<svg viewBox="0 0 48 48" aria-hidden="true">' + inner + "</svg>";
}
const symName = (s) => s.split("-").reverse().join(" ");

function buildPattern({ frame, hunt, img, win, start, move }) {
  const pick = (arr, n) => { const a = arr.slice(); const out = []; while (out.length < n) out.push(a.splice(rand(a.length), 1)[0]); return out; };
  const cp = hunt.pattern && Array.isArray(hunt.pattern.unit) ? hunt.pattern.unit.filter((s) => P_ALL.includes(s)).slice(0, 4) : [];
  const custom = cp.length >= 2;
  const unitLen = custom ? cp.length : [2, 3, 3, 4][rand(4)];
  const unit = custom ? cp : pick(P_ALL, unitLen);
  const TOTAL = 10;
  const seq = Array.from({ length: TOTAL }, (_, i) => unit[i % unitLen]);
  const nBlank = custom ? Math.min(4, Math.max(2, Number(hunt.pattern.blanks) || 3)) : 3;
  const blanks = pick(Array.from({ length: TOTAL - unitLen }, (_, i) => i + unitLen), Math.min(nBlank, TOTAL - unitLen)).sort((a, b) => a - b);
  const extra = pick(P_ALL.filter((s) => !unit.includes(s)), 1);
  const tray = pick([...new Set(unit), ...extra], new Set(unit).size + 1);
  const filled = {};
  let cur = blanks[0], done = false;

  const wrap = el("div", { class: "pat" });
  const gift = el("div", { class: "gift" });
  gift.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="21" width="36" height="23" rx="3" fill="#CC2F40"/><rect x="4" y="14" width="40" height="9" rx="3" fill="#E2384B"/><rect x="21" y="14" width="6" height="30" fill="#F4C54F"/><path d="M24 14 C16 1 5 8 14 14 Z M24 14 C32 1 43 8 34 14 Z" fill="#F4C54F"/></svg>';
  const msg = el("p", { class: "patmsg", role: "status" });
  const grid = el("div", { class: "pgrid" });
  const trayEl = el("div", { class: "ptray" });
  wrap.append(gift, el("h2", { text: "Photo inside!" }), el("p", { class: "patsub", text: "Find the part that repeats, then fill in the empty spots." }), grid, trayEl, msg);

  const nextEmpty = () => blanks.find((i) => !filled[i]);
  const paint = () => {
    grid.textContent = "";
    for (let i = 0; i < TOTAL; i++) {
      const isBlank = blanks.includes(i);
      const sym = isBlank ? filled[i] : seq[i];
      const cell = el("button", { type: "button", class: "pcell" + (isBlank ? " blank" : "") + (isBlank && cur === i ? " cur" : ""), disabled: !isBlank || done,
        "aria-label": isBlank ? (sym ? "Your pick: " + symName(sym) + ". Tap to clear." : "Empty spot " + (i + 1)) : symName(sym),
        onclick: () => { if (done) return; if (filled[i]) delete filled[i]; cur = i; paint(); } });

      } else {
        msg.textContent = "Not quite. Look for the part that repeats and try again.";
        grid.querySelectorAll(".blank").forEach((c) => c.classList.add("shake"));
        setTimeout(() => { blanks.forEach((i) => delete filled[i]); cur = blanks[0]; paint(); }, 650);
      }
    } });

/* --- riddle: unscramble the letters, then the photo is unwrapped --- */
function answerLetters(a) { return String(a || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }

function buildRiddle({ frame, hunt, img, win, start, move }) {
  const words = String(hunt.answer || "").toUpperCase().split(/\s+/).map((w) => w.replace(/[^A-Z0-9]/g, "")).filter(Boolean);
  const target = words.join("");
  const wrap = el("div", { class: "pat" });
  const gift = el("div", { class: "gift" });
  gift.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="21" width="36" height="23" rx="3" fill="#CC2F40"/><rect x="4" y="14" width="40" height="9" rx="3" fill="#E2384B"/><rect x="21" y="14" width="6" height="30" fill="#F4C54F"/><path d="M24 14 C16 1 5 8 14 14 Z M24 14 C32 1 43 8 34 14 Z" fill="#F4C54F"/></svg>';
  if (!String(hunt.riddle || "").trim() || target.length < 2) {
    wrap.append(gift, el("h2", { text: "Almost ready" }), el("p", { class: "patsub", text: "This riddle isn’t finished yet. Ask your teacher." }));
    frame.appendChild(wrap);
    return;
  }

  const tiles = target.split("");
  let tries = 0;
  do {
    for (let i = tiles.length - 1; i > 0; i--) { const j = rand(i + 1); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }
    tries++;
  } while (tiles.join("") === target && new Set(tiles).size > 1 && tries < 50);
  const slots = Array(target.length).fill(-1), used = Array(tiles.length).fill(false);
  let done = false;

  const slotsEl = el("div", { class: "slots" });
  const tilesEl = el("div", { class: "lets" });
  const msg = el("p", { class: "patmsg", role: "status" });
  const rtext = String(hunt.riddle).trim();
  const rp = el("p", { class: "riddle-text", text: rtext });
  rp.style.fontSize = rtext.length <= 70 ? "clamp(28px, 8.5vw, 38px)" : rtext.length <= 150 ? "clamp(24px, 7vw, 31px)" : "clamp(20px, 5.6vw, 25px)";
  wrap.append(el("div", { class: "riddle-card" }, el("span", { class: "kicker", text: "Today\u2019s riddle" }), rp),
    el("p", { class: "patsub", text: "Spell the answer with the letters below." }),
    slotsEl, tilesEl, msg);

  const paint = () => {
    slotsEl.textContent = ""; let k = 0;
    words.forEach((w) => {
      const g = el("div", { class: "word" });
      for (let n = 0; n < w.length; n++) {
        const idx = k++, t = slots[idx];
        g.appendChild(el("button", {
          type: "button", class: "slot" + (t >= 0 ? " filled" : ""), disabled: done || t < 0,
          "aria-label": t >= 0 ? "Letter " + tiles[t] + ". Tap to take it back." : "Empty letter " + (idx + 1),
          onclick: () => { used[slots[idx]] = false; slots[idx] = -1; msg.textContent = ""; paint(); }
        }, t >= 0 ? tiles[t] : ""));
      }
      slotsEl.appendChild(g);
    });
    tilesEl.textContent = "";
    tiles.forEach((ch, i) => tilesEl.appendChild(el("button", { type: "button", class: "let", disabled: used[i] || done, "aria-label": ch, onclick: () => place(i) }, ch)));
  };
  const check = () => {
    const guess = slots.map((t) => tiles[t]).join("");
    if (guess === target) {
      done = true; paint();
      setTimeout(() => { showPhoto(frame, hunt, img, true); win(); }, 450);
    } else {
      msg.textContent = "Not quite. Tap a letter to take it back and try again.";
      slotsEl.querySelectorAll(".slot").forEach((s) => s.classList.add("shake"));
    }
  };
  const place = (i) => {
    if (done || used[i]) return;
    const s = slots.indexOf(-1); if (s < 0) return;

  };

    if (!document.body.contains(wrap)) { window.removeEventListener("keydown", onKey); return; }
    if (done || e.ctrlKey || e.metaKey || e.altKey) return;

      e.preventDefault(); return;
    }

    }
  };
  window.addEventListener("keydown", onKey);
  paint();
  frame.appendChild(wrap);
}

/* ---------- results and leaderboard (served, and cached for 25 seconds, by the Apps Script backend) ---------- */
let boardTab = "day", boardDate = null, boardData = null, boardBusy = false, boardPending = false, confirmClear = null;
let mySeason = null, showNames = true;

async function loadBoard() {
  if (boardBusy) return;
  boardBusy = true;
  try {
    const d = await gasRetry(2, "getBoard", boardTab, boardTab === "day" ? boardDate : null);
    syncClock(d.serverNow);
    boardData = d; boardDate = d.date; mySeason = d.mySeason; showNames = d.showNames;
    renderBoard(); refreshRankStat(); applyLounge();
  } catch (e) { /* keep showing the last board */ }
  boardBusy = false;
  const root = $("board"); if (root) root.style.opacity = "";
}
function startBoardRefresh() {
  setTimeout(() => { if (!document.hidden && !boardPending) loadBoard(); startBoardRefresh(); }, 50000 + Math.random() * 25000);
}

async function recordResult(hunt, st, line) {
  const base = "Finished in " + fmt(st.seconds) + " with " + st.moves + (st.moves === 1 ? " move. " : " moves. ");
  if (game && game.preview) { line.textContent = base + "This was a preview, so it isn’t saved."; return; }
  try {
    const r = await gasRetry(4, "submitScore", hunt.date, st.moves, st.seconds);
    if (!r.ok) line.textContent = base + "Today’s hunt has closed, so this time wasn’t saved.";
    else if (!r.counted) line.textContent = base + "This was a practice run. Your first time today, " + fmt(r.first) + ", is the one that counts.";
    else line.textContent = base + "Your time is on today’s leaderboard.";
    setTimeout(loadBoard, 1500); setTimeout(loadBoard, 27000);
  } catch (e) {
    line.textContent = base + "Your time couldn’t be saved: " + friendly(e);
  }
}

function refreshRankStat() {

/* state of a day, worked out from the clock so it flips at 8:00 without a refresh */
function stateOf(h) {
  const today = todayKey();
  if (h.date < today) return "ended";
  if (h.status === "CLOSED") return "closed";
  if (h.date > today) return "locked";
  if (h.status === "OPEN" || nowMs() >= h.opensAt) return "open";
  return "scheduled";
}

    case "scheduled": return { label: "Opens " + OPEN_HOUR + ":00 AM Eastern", cls: "open", short: "opens at " + OPEN_HOUR + " AM" };
    case "closed": return { label: "Held back", cls: "closed", short: "held back" };
    default: return { label: "Opens " + OPEN_HOUR + ":00 AM on " + prettyDate(h.date), cls: "locked", short: "scheduled" };
  }
}

function processImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 720 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn’t an image the browser can read.")); };
    img.src = url;
  });
}

function makeThumb(dataUri) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 110 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => resolve("");
    img.src = dataUri;
  });
}

async function renderView() {
  stopTimer(); game = null;
  renderViewBar();
  const play = $("play"), token = ++viewToken;
  if (viewMode === "teacher") {
    $("teacher").hidden = false;
    play.textContent = "";

    $("lede").textContent = teacherLede;
    renderTeacher();
    renderBoard();
    return;
  }
  $("teacher").hidden = true;
  showMessage("Loading", "Fetching the student view…");
  let hunt = null, msg = "";
  try {
    if (viewDay === "live") {
      const t = await gas("getToday");
      if (token !== viewToken) return;
      syncClock(t.serverNow);
      if (t.state === "open") { hunt = t.hunt; msg = "This is what students see right now. Your results aren’t saved."; }
    } else {
      const r = await gas("adminPreview", viewDay);
      if (token !== viewToken) return;
      hunt = r.hunt;
      msg = "Previewing " + prettyDate(hunt.date) + ". " + (r.state === "open" ? "Students can see this now." : "Students can’t see this yet.") + " Results aren’t saved.";
    }
  } catch (e) { if (token === viewToken) showMessage("Can’t load that", friendly(e)); return; }
